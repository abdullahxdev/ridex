spring:
  application:
    name: ridex

  datasource:
    url: jdbc:postgresql://localhost:5432/ridex
    username: ridex_user
    password: ridex_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

jwt:
  secret: c2VjcmV0a2V5Zm9yamlkZXhwcm9qZWN0bG9uZ2VudW9naHRvYmVzZWN1cmU=
  expiration-ms: 86400000
  refresh-expiration-ms: 604800000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs